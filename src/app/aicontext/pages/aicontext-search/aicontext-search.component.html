<ocx-portal-page permission="AI_CONTEXT#SEARCH" [helpArticleId]="'AI_CONTEXT_SEARCH.HELP_ARTICLE_ID' | translate"
  *ngrxLet="viewModel$; let vm">
  <ocx-search-header [headline]="'AI_CONTEXT_SEARCH.HEADER' | translate"
    [subheader]="'AI_CONTEXT_SEARCH.SUB_HEADER' | translate" (searched)="search(aIContextSearchFormGroup)"
    (resetted)="resetSearch()" [manualBreadcrumbs]="true" [actions]="(headerActions$ | async) ?? []"
    (viewModeChanged)="viewModeChanged($event)">
    <form [formGroup]="aIContextSearchFormGroup">
      <div class="grid mt-0 p-fluid">
        <div class="col-12 md:col-3">
          <span class="p-float-label">
            <input id="name" pInputText type="text" formControlName="name" class="p-inputtext p-component w-18rem"
              [ngModel]="vm.searchCriteria.name" />
            <label for="name">{{
              'AI_CONTEXT_SEARCH.CRITERIA.NAME' | translate
              }}</label>
          </span>
        </div>
        <div class="col-12 md:col-3">
          <span class="p-float-label">
            <input id="description" pInputText type="text" formControlName="description"
              class="p-inputtext p-component w-18rem" [ngModel]="vm.searchCriteria.description" />
            <label for="description">{{
              'AI_CONTEXT_SEARCH.CRITERIA.DESCRIPTION' | translate
              }}</label>
          </span>
        </div>
        <div class="col-12 md:col-3">
          <span class="p-float-label">
            <input id="appId" pInputText type="text" formControlName="appId" class="p-inputtext p-component w-18rem"
              [ngModel]=" vm.searchCriteria.appId" />
            <label for="appId">{{
              'AI_CONTEXT_SEARCH.CRITERIA.APP_ID' | translate
              }}</label>
          </span>
        </div>

      </div>
    </form>
  </ocx-search-header>
  <ocx-content-container layout="horizontal">
    <ocx-content class="w-full">
      <ocx-interactive-data-view [data]="vm.results" [columns]="vm.columns" [listGridPaginator]="false"
        [emptyResultsMessage]="
          'AI_CONTEXT_SEARCH.EMPTY_RESULTS' | translate
        " [supportedViewLayouts]="['table']" (displayedColumnsChange)="onDisplayedColumnsChange($event)">
      </ocx-interactive-data-view>
    </ocx-content>
    <ocx-content class="w-full lg:w-3" *ngIf="vm.results.length > 0 &&
        vm.chartVisible &&
        (diagramColumn$ | async)
    ">
      <div class="flex flex-column md:flex-row lg:flex-column justify-content-center">
        <ocx-group-by-count-diagram *ngIf="diagramColumn$ | async as diagramColumn" [data]="vm.results"
          [column]="diagramColumn" sumKey="AI_CONTEXT_SEARCH.DIAGRAM.SUM"></ocx-group-by-count-diagram>
      </div>
    </ocx-content>
  </ocx-content-container>
</ocx-portal-page>
