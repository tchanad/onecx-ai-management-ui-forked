openapi: 3.0.3
info:
  title: onecx-ai-ui-bff
  version: '1.0'
paths:
  /aIKnowledgeVectorDb/search:
    post:
      operationId: searchAIKnowledgeVectorDbs
      tags:
        - AIKnowledgeVectorDbBffService
      description: This operation performs a search based on provided search criteria.
        Search for AIKnowledgeVectorDb results.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchAIKnowledgeVectorDbRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAIKnowledgeVectorDbResponse'
        '400':
          description: Bad request
        '500':
          description: Something went wrong
  /aIKnowledgeVectorDb/{id}:
    get:
      x-onecx:
        permissions:
          AIKnowledgeVectorDb:
            - read
      operationId: getAIKnowledgeVectorDbById
      tags:
        - AIKnowledgeVectorDbBffService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAIKnowledgeVectorDbByIdResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
    put:
      x-onecx:
        permissions:
          AIKnowledgeVectorDb:
            - write
      operationId: updateAIKnowledgeVectorDb
      tags:
        - AIKnowledgeVectorDbBffService
      description: This operation performs an update.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAIKnowledgeVectorDb'
      responses:
        '204':
          description: AIKnowledgeVectorDb updated
          headers:
            Location:
              required: true
              schema:
                type: string
                format: url
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIKnowledgeVectorDbUpdateResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        '404':
          description: AIKnowledgeVectorDb not found
    delete:
      tags:
        - AIKnowledgeVectorDbBffService
      operationId: deleteAIKnowledgeVectorDb
      description: Delete AIKnowledgeVectorDb by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: AIKnowledgeVectorDb deleted
  /aIKnowledgeVectorDb:
    post:
      operationId: createAIKnowledgeVectorDb
      tags:
        - AIKnowledgeVectorDbBffService
      description: This operation performs a create.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAIKnowledgeVectorDb'
      responses:
        '201':
          description: New AIKnowledgeVectorDb created
          headers:
            Location:
              required: true
              schema:
                type: string
                format: url
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIKnowledgeVectorDbCreateResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
  /aIKnowledgeDocument/search:
    post:
      operationId: searchAIKnowledgeDocuments
      tags:
        - AIKnowledgeDocumentBffService
      description: This operation performs a search based on provided search criteria.
        Search for AIKnowledgeDocument results.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIKnowledgeDocumentSearchRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIKnowledgeDocumentSearchResponse'
        '400':
          description: Bad request
        '500':
          description: Something went wrong
  /aIKnowledgeDocument/{id}:
    get:
      x-onecx:
        permissions:
          AIKnowledgeDocument:
            - read
      operationId: getAIKnowledgeDocumentById
      tags:
        - AIKnowledgeDocumentBffService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAIKnowledgeDocumentByIdResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
    put:
      operationId: updateAIKnowledgeDocument
      tags:
        - AIKnowledgeDocumentBffService
      description: This operation performs an update.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAIKnowledgeDocument'
      responses:
        '204':
          description: AIKnowledgeDocument updated
          headers:
            Location:
              required: true
              schema:
                type: string
                format: url
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIKnowledgeDocumentUpdateResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        '404':
          description: AIKnowledgeDocument not found
    delete:
      tags:
        - AIKnowledgeDocumentBffService
      operationId: deleteAIKnowledgeDocument
      description: Delete AIKnowledgeDocument by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: AIKnowledgeDocument deleted
  /aIKnowledgeDocument:
    post:
      operationId: createAIKnowledgeDocument
      tags:
        - AIKnowledgeDocumentBffService
      description: This operation performs a create.
      parameters:
        - name: id
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAIKnowledgeDocument'
      responses:
        '201':
          description: New AIKnowledgeDocument created
          headers:
            Location:
              required: true
              schema:
                type: string
                format: url
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIKnowledgeDocumentCreateResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
  /aIContext/search:
    post:
      operationId: searchAIContexts
      tags:
        - AIContextBffService
      description: This operation performs a search based on provided search criteria.
        Search for AIContext results.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIContextSearchRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIContextSearchResponse'
        '400':
          description: Bad request
        '500':
          description: Something went wrong
components:
  schemas:
    AIKnowledgeVectorDb:
      type: object
      required:
        - id
      properties:
        modificationCount:
          type: integer
          format: int32
        id:
          type: string
        name:
          type: string
        description:
          type: string
        vdb:
          type: string
        vdbCollection:
          type: string
        aIContext:
          type: object
          $ref: '#/components/schemas/AIContext'
    SearchAIKnowledgeVectorDbRequest:
      type: object
      properties:
        limit:
          type: integer
          maximum: 2500
        id:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
        vdb:
          type: string
        vdbCollection:
          type: string
    SearchAIKnowledgeVectorDbResponse:
      type: object
      required:
        - results
        - totalNumberOfResults
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AIKnowledgeVectorDb'
        totalNumberOfResults:
          type: integer
          format: int32
          description: Total number of results on the server.
    ProblemDetailResponse:
      type: object
      properties:
        errorCode:
          type: string
        detail:
          type: string
        params:
          type: array
          items:
            $ref: '#/components/schemas/ProblemDetailParam'
        invalidParams:
          type: array
          items:
            $ref: '#/components/schemas/ProblemDetailInvalidParam'
    ProblemDetailParam:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    ProblemDetailInvalidParam:
      type: object
      properties:
        name:
          type: string
        message:
          type: string
    GetAIKnowledgeVectorDbByIdResponse:
      type: object
      required:
        - result
      properties:
        result:
          $ref: '#/components/schemas/AIKnowledgeVectorDb'
    CreateAIKnowledgeVectorDb:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        appId:
          type: string
    UpdateAIKnowledgeVectorDb:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        appId:
          type: string
    AIKnowledgeVectorDbCreateResponse:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        vdb:
          type: string
        vdbCollection:
          type: string
        aIContext:
          type: object
          $ref: '#/components/schemas/AIContext'
    AIKnowledgeVectorDbUpdateResponse:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        vdb:
          type: string
        vdbCollection:
          type: string
        aIContext:
          type: object
          $ref: '#/components/schemas/AIContext'
    AIContext:
      type: object
      properties:
        id:
          type: string
        appId:
          type: string
        name:
          type: string
        description:
          type: string
        modificationCount:
          type: integer
          format: int32
        modificationUser:
          type: string
        creationUser:
          type: string
        creationDate:
          $ref: '#/components/schemas/OffsetDateTime'
        modificationDate:
          $ref: '#/components/schemas/OffsetDateTime'
        aIKnowledgeBase:
          $ref: '#/components/schemas/AIKnowledgeBase'
        aIKnowledgeVectorDb:
          $ref: '#/components/schemas/AIKnowledgeVectorDb'
        aIKnowledgeDbs:
          type: array
          items:
            $ref: '#/components/schemas/AIKnowledgeDatabase'
        aIKnowledgeDocuments:
          type: array
          items:
            $ref: '#/components/schemas/AIKnowledgeDocument'
        provider:
          $ref: '#/components/schemas/AIProvider'
    AIKnowledgeDocument:
      type: object
      required:
        - id
        - name
      properties:
        modificationCount:
          type: integer
          format: int32
        id:
          type: string
        name:
          type: string
        documentRefId:
          type: string
        status:
          $ref: '#/components/schemas/AIKnowledgeDocumentStatusType'
    AIKnowledgeDocumentCreateRequest:
      type: object
      required:
        - name
        - documentRefId
      properties:
        name:
          type: string
        documentRefId:
          type: string
        status:
          $ref: '#/components/schemas/AIKnowledgeDocumentStatusType'
    AIKnowledgeDocumentUpdateRequest:
      type: object
      required:
        - documentRefId
        - modificationCount
      properties:
        id:
          type: string
        name:
          type: string
        documentRefId:
          type: string
        modificationCount:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/AIKnowledgeDocumentStatusType'
    AIKnowledgeDocumentStatusType:
      type: string
      enum:
        - NEW
        - PROCESSING
        - EMBEDDED
    AIKnowledgeDocumentSearchRequest:
      type: object
      properties:
        limit:
          type: integer
          maximum: 2500
        id:
          type: string
        name:
          type: string
        documentRefId:
          type: string
        status:
          $ref: '#/components/schemas/AIKnowledgeDocumentStatusType'
    AIKnowledgeDocumentSearchResponse:
      type: object
      required:
        - results
        - totalNumberOfResults
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AIKnowledgeDocument'
        totalNumberOfResults:
          type: integer
          format: int32
          description: Total number of results on the server.
    GetAIKnowledgeDocumentByIdResponse:
      type: object
      required:
        - result
      properties:
        result:
          $ref: '#/components/schemas/AIKnowledgeDocument'
    CreateAIKnowledgeDocument:
      type: object
      required:
        - aIKnowledgeDocumentData
      properties:
        aIKnowledgeDocumentData:
          type: object
          $ref: '#/components/schemas/AIKnowledgeDocumentCreateRequest'
    UpdateAIKnowledgeDocument:
      type: object
      required:
        - aIKnowledgeDocumentData
      properties:
        aIKnowledgeDocumentData:
          type: object
          $ref: '#/components/schemas/AIKnowledgeDocumentUpdateRequest'
    AIKnowledgeDocumentCreateResponse:
      type: object
      required:
        - name
        - documentRefId
      properties:
        id:
          type: string
        name:
          type: string
        documentRefId:
          type: string
        status:
          $ref: '#/components/schemas/AIKnowledgeDocumentStatusType'
    AIKnowledgeDocumentUpdateResponse:
      type: object
      required:
        - name
        - documentRefId
      properties:
        id:
          type: string
        name:
          type: string
        documentRefId:
          type: string
        status:
          $ref: '#/components/schemas/AIKnowledgeDocumentStatusType'
    AIKnowledgeBase:
      properties:
        modificationCount:
          format: int32
          type: integer
        creationDate:
          $ref: '#/components/schemas/OffsetDateTime'
        creationUser:
          type: string
        modificationDate:
          $ref: '#/components/schemas/OffsetDateTime'
        modificationUser:
          type: string
        id:
          type: string
        description:
          type: string
        name:
          type: string
        appId:
          type: string
        contexts:
          type: array
          items:
            $ref: '#/components/schemas/AIContext'
    AIKnowledgeDatabase:
      required:
        - db
        - user
        - pwd
      type: object
      properties:
        modificationCount:
          format: int32
          type: integer
        creationDate:
          $ref: '#/components/schemas/OffsetDateTime'
        creationUser:
          type: string
        modificationDate:
          $ref: '#/components/schemas/OffsetDateTime'
        modificationUser:
          type: string
        id:
          type: string
        name:
          type: string
        description:
          type: string
        db:
          type: string
        user:
          type: string
        pwd:
          type: string
        tables:
          type: array
          items:
            type: string
    AIProvider:
      required:
        - name
        - modelName
        - modelVersion
      type: object
      properties:
        modificationCount:
          format: int32
          type: integer
        creationDate:
          $ref: '#/components/schemas/OffsetDateTime'
        creationUser:
          type: string
        modificationDate:
          $ref: '#/components/schemas/OffsetDateTime'
        modificationUser:
          type: string
        id:
          type: string
        name:
          type: string
        description:
          type: string
        llmUrl:
          type: string
        modelName:
          type: string
        modelVersion:
          type: string
        appId:
          type: string
        apiKey:
          type: string
    OffsetDateTime:
      type: string
      format: date-time
      example: 2025-04-10T11:30:50-04:00
    # AIContext:
    #   type: object
    #   required:
    #     - id
    #   properties:
    #     modificationCount:
    #       type: integer
    #       format: int32
    #     id:
    #       type: string
    #     # "ACTION S1: add additional properties here"
    AIContextSearchRequest:
      type: object
      properties:
        limit:
          type: integer
          maximum: 2500
        name:
          type: string
        appId:
          type: string
        description:
          type: string
        pageNumber:
          format: int32
          description: The number of page.
          default: 0
          type: integer
        pageSize:
          format: int32
          description: The size of page
          default: 10
          maximum: 100
          type: integer
    AIContextSearchResponse:
      type: object
      required:
        - results
        - totalNumberOfResults
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AIContext'
        totalNumberOfResults:
          type: integer
          format: int32
          description: Total number of results on the server.
